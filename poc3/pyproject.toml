[project]
name = "integral-prism-poc3"
version = "0.3.0"
description = "Integral Prism PoC — Biz DD カバレッジ監査ループ"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "pypdf>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
