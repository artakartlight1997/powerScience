<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クイズ | Aki’s Power BI 道場</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css?v=70acef71">
<link rel="stylesheet" href="assets/css/search.css?v=56b3a91e">
<link rel="stylesheet" href="assets/css/figure.css?v=521727e1">
<link rel="stylesheet" href="assets/css/interactive.css?v=f4cfc731">
<link rel="stylesheet" href="assets/css/glossary.css?v=e41f4d6b">
<link rel="stylesheet" href="assets/css/lesson.css?v=863d9c6e">
<script src="assets/js/config.js?v=dbf88e4a"></script>
</head>
<body>
<main id="main" class="wrap-narrow" style="padding-top:26px">
  <div id="head"></div>
  <div id="quiz"></div>
</main>
<script src="assets/vendor/marked.umd.js?v=5dbc0daa"></script>
<script src="assets/js/app.js?v=b855ea7b"></script>
<script src="assets/js/search.js?v=0675a18e"></script>
<script src="assets/js/analytics.js?v=b6fe81c9"></script>
<script src="assets/js/render.js?v=4460cfca"></script>
<script src="assets/js/figure.js?v=4b483f10"></script>
<script src="assets/js/interactive.js?v=8c7608c9"></script>
<script src="assets/js/glossary.js?v=b039b5b2"></script>
<script src="assets/js/quiz.js?v=d8542833"></script>
<script>
(async function () {
  PBM.renderChrome();
  const id = PBM.qs("id");
  const c = await PBM.curriculum();
  const quiz = await PBM.loadQuiz(id);
  const head = document.getElementById("head");
  if (!quiz) {
    head.innerHTML = '<div class="card"><h1>クイズが見つかりません</h1>' +
      '<p class="muted">このレッスンのクイズはまだ準備中です。</p>' +
      '<a class="btn btn-brand btn-sm" href="quizzes.html">クイズ一覧へ</a></div>';
    return;
  }
  const lesson = quiz.lesson ? c.lessonById[quiz.lesson] : null;
  document.title = quiz.title + " | Aki’s Power BI 道場";
  head.innerHTML =
    (lesson ? '<p class="small muted"><a href="lesson.html?id=' + lesson.id + '">← ' + PBM.esc(lesson.title) + "</a></p>" : "") +
    '<h1 style="font-size:22px;margin:8px 0 4px">' + PBM.esc(quiz.title) + "</h1>" +
    '<p class="small muted">選択肢はキーボードの A / B / C / D、次へは Enter でも操作できます。</p>';

  PBM.mountQuiz(document.getElementById("quiz"), quiz, {
    mode: "practice",
    shuffle: true,
    onFinish: function (r) { PBM.progress.setQuizResult(quiz.id, r.correct, r.total); }
  });
})();
</script>
</body>
</html>
