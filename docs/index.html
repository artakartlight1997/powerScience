<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たい焼き屋のデータ入門</title>
<meta name="description" content="中学生のあきと一緒に、おじいちゃんのたい焼き屋を数字で立て直す。専門用語なしで学ぶ Power BI 入門。">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/app.js"></script>
<main class="wrap">
  <section class="hero">
    <h1 id="h-title">たい焼き屋のデータ入門</h1>
    <p class="sub" id="h-sub"></p>
    <div class="lead" id="h-lead"></div>
  </section>
  <div id="chapters"></div>
</main>
<script>
(function () {
  TD.header();
  var box = document.getElementById("chapters");
  TD.course().then(function (c) {
    document.getElementById("h-title").textContent = c.title;
    document.getElementById("h-sub").textContent = c.subtitle || "";
    document.getElementById("h-lead").textContent = (c.story && c.story.setup) || "";
    document.title = c.title;

    var done = TD.doneMap();
    box.innerHTML = (c.chapters || []).map(function (ch, ci) {
      return '<section class="chapter">' +
        '<div class="chapter-head">' +
          '<span class="chapter-no">第' + (ci + 1) + "章</span>" +
          "<h2>" + esc(ch.title) + "</h2>" +
          '<p class="goal">' + esc(ch.goal || "") + "</p>" +
          (ch.note ? '<p class="note">' + esc(ch.note) + "</p>" : "") +
        "</div>" +
        '<ul class="lesson-list">' +
        (ch.lessons || []).map(function (l, li) {
          return "<li><a " + (done[l.id] ? 'class="done" ' : "") +
            'href="lesson.html?id=' + encodeURIComponent(l.id) + '">' +
            '<span class="n">' + (done[l.id] ? "✓" : (li + 1)) + "</span>" +
            '<span class="t">' + esc(l.title) +
            (l.q ? '<span class="q">' + esc(l.q) + "</span>" : "") +
            "</span></a></li>";
        }).join("") +
        "</ul></section>";
    }).join("");
    TD.footer();
  }).catch(function (e) {
    box.innerHTML = "<p>目次を読み込めませんでした。" + esc(e.message) + "</p>";
  });
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
