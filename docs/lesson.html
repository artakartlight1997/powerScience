<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レッスン | たい焼き屋のデータ入門</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/figure.css">
<script src="assets/js/app.js"></script>
<script src="assets/vendor/marked.umd.js"></script>
<script src="assets/js/figure.js"></script>
<script src="assets/js/render.js"></script>
<main class="wrap">
  <div class="lesson-head">
    <div class="crumb" id="crumb"></div>
    <h1 id="title">読み込み中…</h1>
    <div class="qa" id="qa"></div>
  </div>
  <article class="prose" id="body"></article>
  <button class="btn-done" id="done" hidden>読み終わった</button>
  <nav class="pager" id="pager"></nav>
</main>
<script>
(function () {
  TD.header();
  var id = new URLSearchParams(location.search).get("id") || "";
  var bodyEl = document.getElementById("body");

  TD.course().then(function (c) {
    var l = c.byId[id];
    if (!l) { bodyEl.innerHTML = "<p>そのレッスンは見つかりませんでした。</p>"; TD.footer(); return; }

    document.title = l.title + " | " + c.title;
    document.getElementById("crumb").textContent = "第" + l.chapterNo + "章  " + l.chapter;
    document.getElementById("title").textContent = l.title;
    document.getElementById("qa").innerHTML =
      (l.q ? '<div class="q"><b>あきの困りごと</b>' + esc(l.q) + "</div>" : "") +
      (l.gain ? '<div class="g"><b>これができるようになる</b>' + esc(l.gain) + "</div>" : "");

    return fetch(TD.url("content/lessons/" + l.id + ".md"), { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("本文がまだありません (" + r.status + ")");
        return r.text();
      })
      .then(function (md) {
        bodyEl.innerHTML = PBM.markdown(md);
        return PBM.enhance(bodyEl);
      })
      .then(function () { pager(c, l); doneButton(l); })
      .catch(function (e) {
        bodyEl.innerHTML = "<p>" + esc(e.message) + "</p>";
        pager(c, l);
      });
  }).catch(function (e) {
    bodyEl.innerHTML = "<p>" + esc(e.message) + "</p>";
  });

  function pager(c, l) {
    var p = c.flat[l.index - 1], n = c.flat[l.index + 1];
    document.getElementById("pager").innerHTML =
      (p ? '<a href="lesson.html?id=' + encodeURIComponent(p.id) + '">' +
           '<span class="dir">← 前</span><span class="t">' + esc(p.title) + "</span></a>" : "") +
      (n ? '<a class="next" href="lesson.html?id=' + encodeURIComponent(n.id) + '">' +
           '<span class="dir">次 →</span><span class="t">' + esc(n.title) + "</span></a>"
         : '<a class="next" href="index.html"><span class="dir">目次へ</span>' +
           '<span class="t">ここまでで初級はおしまい</span></a>');
    TD.footer();
  }

  function doneButton(l) {
    var b = document.getElementById("done");
    b.hidden = false;
    var on = TD.isDone(l.id);
    paint();
    b.addEventListener("click", function () { on = TD.setDone(l.id, !on); paint(); });
    function paint() {
      b.dataset.on = on ? "1" : "0";
      b.textContent = on ? "✓ 読み終わった" : "読み終わった";
    }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
