<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学習記録 | Power BI Mastery</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/config.js"></script>
</head>
<body>
<main id="main" class="wrap" style="padding-top:34px">
  <p class="eyebrow">My Progress</p>
  <h1 style="margin:8px 0 6px">学習記録</h1>
  <p class="muted small">記録はこの端末のブラウザ内（localStorage）にのみ保存されます。端末を変える場合は下のエクスポート機能をお使いください。</p>

  <div class="grid grid-4" style="margin:22px 0">
    <div class="card kpi"><div class="v" id="k1">0%</div><div class="l">全体の進捗</div></div>
    <div class="card kpi"><div class="v" id="k2">0</div><div class="l">完了レッスン</div></div>
    <div class="card kpi"><div class="v" id="k3">0</div><div class="l">完了ラボ</div></div>
    <div class="card kpi"><div class="v" id="k4">0分</div><div class="l">学習時間</div></div>
  </div>

  <div class="card"><h3 style="margin-top:0">レベル別の到達度</h3><div id="levels"></div></div>

  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">クイズの成績</h3><div id="quizzes"></div></div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">模擬試験の推移</h3>
    <div id="examchart"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">データの管理</h3>
    <p class="small muted">別の端末に引き継ぐときは、エクスポートしたテキストをコピーして、移行先でインポートしてください。</p>
    <div class="row">
      <button class="btn btn-sm" id="btn-export">エクスポート</button>
      <button class="btn btn-sm" id="btn-import">インポート</button>
      <button class="btn btn-sm btn-ghost" id="btn-reset" style="color:var(--ng)">すべてリセット</button>
    </div>
    <textarea id="io" rows="6" style="margin-top:12px;display:none;font-family:var(--mono);font-size:12px"></textarea>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">アクセス解析について</h3>
    <p class="small muted">サイト改善のため、どのページがどの地域からいつ閲覧されたかを匿名で集計しています（IPアドレスは保存しません）。集計を止めたい場合は下のボタンを押してください。</p>
    <button class="btn btn-sm" id="btn-optout"></button>
  </div>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/analytics.js"></script>
<script>
(async function () {
  PBM.renderChrome();
  const c = await PBM.curriculum();
  const s = PBM.stats(c);
  document.getElementById("k1").textContent = s.pct + "%";
  document.getElementById("k2").textContent = s.lessonsDone + "/" + s.lessonsTotal;
  document.getElementById("k3").textContent = s.labsDone + "/" + s.labsTotal;
  document.getElementById("k4").textContent = PBM.fmtMin(s.minutes);

  document.getElementById("levels").innerHTML = c.levels.map(function (lv) {
    const st = PBM.levelStats(c, lv.id);
    return '<div class="area-row"><div><div class="nm">' + PBM.esc(lv.title) + " " + PBM.esc(lv.subtitle) + "</div>" +
      '<div class="bar"><span style="width:' + st.pct + "%;background:var(--lv" + lv.order + ')"></span></div></div>' +
      '<div class="small" style="text-align:right">' + st.done + "/" + st.total + "</div></div>";
  }).join("");

  const p = PBM.progress.all();
  const qz = Object.entries(p.quizzes || {});
  document.getElementById("quizzes").innerHTML = qz.length
    ? qz.sort(function (a, b) { return a[1].best - b[1].best; }).map(function (e) {
        const l = c.lessons.find(function (x) { return x.quiz === e[0]; });
        return '<div class="area-row"><div><div class="nm">' + PBM.esc(l ? l.title : e[0]) + "</div>" +
          '<div class="bar"><span style="width:' + e[1].best + "%;background:var(--" + (e[1].best >= 80 ? "ok" : e[1].best >= 60 ? "warn" : "ng") + ')"></span></div></div>' +
          '<div class="small" style="text-align:right">' + e[1].best + "%</div></div>";
      }).join("")
    : '<p class="muted small">まだクイズに挑戦していません。</p>';

  const ex = PBM.progress.exams();
  const chart = document.getElementById("examchart");
  if (!ex.length) chart.innerHTML = '<p class="muted small">まだ模擬試験の記録がありません。<a href="exam.html">受けてみる →</a></p>';
  else {
    const w = 100 / Math.max(ex.length, 6);
    chart.innerHTML = '<div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px">' +
      ex.slice(-12).map(function (e) {
        const col = e.score >= 80 ? "ok" : e.score >= 70 ? "warn" : "ng";
        return '<div style="flex:1;text-align:center">' +
          '<div style="height:' + Math.max(4, e.score) + '%;background:var(--' + col + ');border-radius:5px 5px 0 0"></div>' +
          '<div class="small" style="font-size:11px;margin-top:4px">' + e.score + "%</div></div>";
      }).join("") + "</div>" +
      '<p class="small muted">直近' + Math.min(ex.length, 12) + "回。70%が合格ライン、80%以上が安全圏の目安です。</p>";
  }

  const io = document.getElementById("io");
  document.getElementById("btn-export").addEventListener("click", function () {
    io.style.display = "block"; io.value = PBM.progress.export(); io.select();
  });
  document.getElementById("btn-import").addEventListener("click", function () {
    if (io.style.display === "none" || !io.value.trim()) {
      io.style.display = "block"; io.value = ""; io.placeholder = "ここにエクスポートしたテキストを貼り付けて、もう一度「インポート」を押してください"; io.focus(); return;
    }
    try { PBM.progress.import(io.value); alert("インポートしました。"); location.reload(); }
    catch (e) { alert("読み込めませんでした：" + e.message); }
  });
  document.getElementById("btn-reset").addEventListener("click", function () {
    if (confirm("すべての学習記録を削除します。よろしいですか？")) { PBM.progress.reset(); location.reload(); }
  });

  const ob = document.getElementById("btn-optout");
  function drawOb() { ob.textContent = PBM.isOptedOut() ? "集計を再開する" : "集計を停止する（この端末のみ）"; }
  ob.addEventListener("click", function () { PBM.optOut(!PBM.isOptedOut()); drawOb(); });
  drawOb();
})();
</script>
</body>
</html>
