# ファンド基準: カバレッジ判定・停止則・信頼層のパラメータ
# 本ファイルの変更は人間の承認を要する(P13: 評価器の定義は人間が握る)
judgment:
  # filled の最低条件(証拠の密度で測る。文字数では測らない)
  filled_min_clusters: 2          # 独立クラスタ数(P22: 同一上流ソース由来は1と数える)
  filled_seller_only_forbidden: true   # 売り手証拠のみでは filled にできない(I3相当)
  thin_min_clusters: 1            # 1クラスタ以上あれば thin(あるが薄い)
  freshness_days: 730             # これより古い証拠は密度計算で減衰扱い
  expect_absent_needs_confirmation: true  # 「該当なし」も確認証拠が必要(確認済みfilled)
trust_tiers:                      # trust_tier: 小さいほど信頼できる
  filing: 1                       # 開示・登記
  premium_db: 2                   # 有償DB
  web: 3                          # 一般Web(要スナップショット)
  consultant: 2                   # コンサル成果物(検収対象でもある)
  seller: 5                       # IM・ティーザー=売り手の主張。単独でfilled不可
stop_rules:                       # 4停止条件(arch/02-pipeline)
  max_iterations: 5               # ループ上限(P15: 長く回すほど良くなるは幻想)
  max_llm_calls: 200
  min_new_filled_per_iter: 1      # 前回比で新規filled/thinがこれ未満なら収穫逓減で停止
  unknown_all_routed: true        # 残りが全て vdr/expert 行きなら公開フェーズ完了
question_budget:
  max_open_questions: 30          # 発注仕様書に載せる未解決問いの上限
online:
  allowed_hosts: []               # 空 = 全ホスト許可(社内運用)。指定時はallowlist
  max_fetch_per_iter: 10
  snapshot_required: true         # スナップショットなしのWeb証拠はgroundedにできない
