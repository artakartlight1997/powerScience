# PoC v2 のCIゲート(poc2/docs/EVALUATION.md の G-U/G-I/G-C/G-S)。
name: poc2-tests
on:
  push:
    paths: ["poc2/**", ".github/workflows/poc2-tests.yml"]
  pull_request:
    paths: ["poc2/**", ".github/workflows/poc2-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyflakes
      - name: G-C compileall
        run: python -m compileall -q prism tests
      - name: G-C pyflakes
        run: python -m pyflakes prism tests
      - name: G-U/G-I tests
        run: pytest tests -q
      - name: G-S secret scan
        run: |
          if grep -rInE 'sk-or-v1-[A-Za-z0-9]{16,}' . --exclude-dir=.git; then
            echo "APIキーらしき文字列を検出"; exit 1
          fi
          echo "秘密情報の検出ゼロ"
