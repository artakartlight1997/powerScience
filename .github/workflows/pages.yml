name: Validate content

# 公開は GitHub Pages の「Deploy from a branch」で行います
#   Settings → Pages → Source: Deploy from a branch → Branch: main / フォルダ: /docs
# main に push すれば GitHub が docs/ をそのまま配信します。
# このワークフローは公開処理をせず、壊れたまま公開されていないかを検査するだけです。
#
# 注意: このリポジトリは public なので GitHub Actions の利用は無料です
#       （実行時間の課金は private リポジトリのみ）。
#       それでも動かしたくない場合は Actions タブでこのワークフローを Disable してください。
#       公開はワークフローに依存していないので、止めてもサイトは出ます。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'worker/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data files and validate content
        run: python3 scripts/build_all.py

      - name: Test analytics worker
        run: node worker/test/worker.test.mjs

      - name: Check no Mermaid remains
        run: |
          if grep -rl '```mermaid' docs/content/ 2>/dev/null; then
            echo "Mermaid は廃止されました。figure ブロックを使ってください。"; exit 1
          fi
          echo "OK: Mermaid は使われていません"

      - name: Check generated files are committed
        run: |
          # docs/ をそのまま配信するため、生成物がコミット漏れだと
          # 古いカリキュラムが公開されてしまう
          if ! git diff --quiet -- docs/content; then
            echo "::error::生成物がコミットされていません。"
            echo "ローカルで python3 scripts/build_all.py を実行し、docs/content の差分をコミットしてください。"
            git diff --stat -- docs/content
            exit 1
          fi
          echo "OK: 生成物は最新です"
