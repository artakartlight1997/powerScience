name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data files and validate content
        run: python3 scripts/build_all.py

      - name: Test analytics worker
        run: node worker/test/worker.test.mjs

      - name: Check reading volume (v3 density rules)
        run: |
          python3 scripts/check_density.py
          python3 scripts/check_density.py --labs

      - name: Check no Mermaid remains
        run: |
          if grep -rl '```mermaid' docs/content/ 2>/dev/null; then
            echo "Mermaid は廃止されました。figure ブロックを使ってください。"; exit 1
          fi
          echo "OK: Mermaid は使われていません"

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: |
            docs/content/curriculum.json
            docs/content/pl300.json
            docs/content/glossary/index.json
            docs/content/quizzes/index.json
          retention-days: 7

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build data files
        run: python3 scripts/build_all.py || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
