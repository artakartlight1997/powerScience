name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data files and validate content
        run: python3 scripts/build_all.py

      - name: Test analytics worker
        run: node worker/test/worker.test.mjs

      # 圧縮作業が完了するまでは結果を表示するだけ（デプロイは止めない）
      - name: Check reading volume (v3 density rules)
        continue-on-error: true
        run: |
          python3 scripts/check_density.py
          python3 scripts/check_density.py --labs

      - name: Check no Mermaid remains
        run: |
          if grep -rl '```mermaid' docs/content/ 2>/dev/null; then
            echo "Mermaid は廃止されました。figure ブロックを使ってください。"; exit 1
          fi
          echo "OK: Mermaid は使われていません"

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: |
            docs/content/curriculum.json
            docs/content/pl300.json
            docs/content/glossary/index.json
            docs/content/quizzes/index.json
          retention-days: 7

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build data files
        run: python3 scripts/build_all.py || true
      # enablement: true を付けると、Settings → Pages を手で設定していなくても
      # このワークフローが GitHub Pages を有効化しようとします。
      # ただし GITHUB_TOKEN に administration 権限がない場合は
      # 「Resource not accessible by integration」で失敗します。
      # そのときは下の案内のとおり、一度だけ手で有効化してください。
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: GitHub Pages が有効になっているか確認する
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages が有効になっていません::"
          echo "リポジトリの Settings -> Pages を開き、Source を 'GitHub Actions' に設定してください。"
          echo "この操作はリポジトリの管理者のみが実行できます（ワークフローの権限では変更できません）。"
          echo "設定後、このワークフローを再実行すれば公開されます。"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
